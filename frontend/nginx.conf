server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Used by docker-compose, where nothing sits in front of us. On EKS the ALB
    # sends /api straight to the backend Service, so this block is never hit.
    # The hostname "backend" resolves in compose and as the k8s Service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve static files; fall back to index.html for client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
