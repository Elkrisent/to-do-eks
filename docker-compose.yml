services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"   # exposed so you can run the integration tests from your host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://todo:todo@postgres:5432/todo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"   # direct API access, handy for curl/docs at /docs

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"   # open http://localhost:8080

volumes:
  pgdata:
