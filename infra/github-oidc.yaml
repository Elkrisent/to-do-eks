AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions deploy to AWS without stored access keys. GitHub proves who a
  workflow run is with a short-lived signed token; this role trusts only that token
  from one repo and one GitHub Environment.

Parameters:
  GitHubRepo:
    Type: String
    Default: Elkrisent/to-do-eks
    Description: owner/name of the repo allowed to deploy
  GitHubEnvironment:
    Type: String
    Default: production
    Description: Only workflow jobs running in this GitHub Environment can assume the role
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: An account can have only ONE GitHub OIDC provider. Set false if it already exists.
  ClusterName:
    Type: String
    Default: todo-eks

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: todo-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The "sub" claim names the repo and environment of the running job.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"      # this action cannot be scoped to a repository
              - Sid: EcrPushOurRepos
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/todo-backend
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/todo-frontend
              - Sid: EksKubeconfig
                Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - Sid: ReadStackOutputs
                # The workflow reads the ALB security group ID and the CloudFront URL from these stacks.
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/todo-alb-sg/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/todo-cloudfront/*

Outputs:
  RoleArn:
    Description: Save this as the GitHub repo variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
