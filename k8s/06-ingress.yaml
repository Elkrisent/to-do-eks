# The AWS Load Balancer Controller sees this and builds one internet-facing ALB:
#   /api/*  -> backend Service     everything else -> frontend Service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Send traffic straight to pod IPs (needs the VPC CNI, which EKS uses by default).
    alb.ingress.kubernetes.io/target-type: ip
    # Default health check; the backend Service overrides it with /api/healthz.
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Only CloudFront may reach the ALB (security group from infra/alb-security-group.yaml).
    # ${ALB_SG_ID} is filled in by envsubst.
    alb.ingress.kubernetes.io/security-groups: ${ALB_SG_ID}
    # Lets the controller open the nodes' security group to traffic from the ALB's group.
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }
