name: CI

# Runs on every pull request, and is also called by deploy.yml so that
# main is never deployed without passing the same checks.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres for the integration tests, started alongside the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://todo:todo@localhost:5432/todo_test
        run: pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  manifests:
    # Catch typos and invalid fields in k8s/*.yaml before they reach a cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill in image placeholders with dummy values
        run: |
          mkdir rendered
          export ECR_REGISTRY=123456789012.dkr.ecr.us-east-1.amazonaws.com IMAGE_TAG=ci
          # shellcheck disable=SC2016  # envsubst needs the literal ${...} variable list
          VARS='${ECR_REGISTRY} ${IMAGE_TAG}'
          for f in k8s/0*.yaml; do
            out="rendered/$(basename "$f")"
            envsubst "$VARS" < "$f" > "$out"
          done
      - name: Validate against the Kubernetes schema
        run: |
          docker run --rm -v "$PWD/rendered:/m:ro" ghcr.io/yannh/kubeconform:latest \
            -strict -summary -kubernetes-version 1.36.0 /m

  images:
    # Build both images exactly as production would, then scan them for known CVEs.
    # Nothing is pushed here; pushing happens only in deploy.yml.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          tags: todo-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # only fail on vulnerabilities that have a fix available
          exit-code: "1"
